services:
  - type: web
    name: d2deals-driveway
    runtime: node
    # NODE_ENV is production on Render, so explicitly include Vite and the
    # other build-time devDependencies before creating the frontend bundle.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
